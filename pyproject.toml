[project]
name = "sendashield"
version = "0.1.0"
description = "Self-hosted MCP server that filters sensitive content from mail and calendar before an AI assistant sees it."
authors = [
    { name = "bj-taduran", email = "bj.taduran@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.165.2",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Ruff also formats fenced Python code blocks inside Markdown; docs/ and the
# root-level docs contain illustrative snippets that aren't real source, so
# keep ruff scoped to the actual project.
extend-exclude = ["docs", "private", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
# "tests" is on the path so `from conftest import ...` resolves for mypy the way pytest
# already resolves it at runtime. Without it, tests/test_network_blocked.py raised a
# standing import-not-found error — and that test guards the outbound-network block, so it
# is the last file in the repo that should be sitting behind a known type error.
mypy_path = ["src", "tests"]
explicit_package_bases = true
warn_unused_configs = true

# Strict everywhere in the package, not only on detect/ and policy/. CLAUDE.md names those
# two because they are where correctness is hardest; it is not a licence for the rest to go
# unchecked, and normalise.py is 1000+ lines of exactly the parsing code a type error would
# hide in. The per-module override below stays because it is what CLAUDE.md asks for by
# name, and so the requirement survives if this global setting is ever relaxed.
strict = true

[[tool.mypy.overrides]]
module = ["sendashield.detect.*", "sendashield.policy.*"]
strict = true

[tool.pytest.ini_options]
# --strict-markers turns use of an unregistered marker into a hard error
# instead of a warning, so a typo'd @pytest.mark.golen fails loudly.
addopts = "--strict-markers"
markers = [
    "golden: runs a case from the golden fixture corpus",
    "leak: asserts an invariant that must never regress (run before every commit)",
    "slow: excluded from the default fast run",
]
