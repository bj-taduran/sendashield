name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      # Was `src/sendashield/detect src/sendashield/policy`, which by this point checked
      # zero lines: both packages are still empty scaffolding, while normalise.py and
      # ical.py — 1400 lines of parsing code — were not covered at all. A green gate that
      # inspects nothing is worse than no gate, because it reads as assurance.
      - name: mypy
        run: uv run mypy src/sendashield tests

      - name: pytest
        run: uv run pytest
